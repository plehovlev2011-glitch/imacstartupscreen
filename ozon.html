<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главный экран для бабушки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #2b4a6f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        /* Верхняя плашка с кнопками навигации */
        .top-nav {
            width: 100%;
            background: #1f3a5f;
            padding: 15px 30px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            border-bottom: 3px solid #ffd700;
        }

        .nav-btn {
            background: #ffd700;
            border: none;
            border-radius: 40px;
            padding: 15px 35px;
            font-size: 2rem;
            font-weight: bold;
            color: #1f3a5f;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 5px 0 #b8860b;
            transition: 0.05s linear;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b8860b;
        }

        /* Заголовок над баннерами */
        .banner-header {
            width: 100%;
            text-align: left;
            padding: 25px 30px 10px 30px;
            font-size: 2.4rem;
            font-weight: 600;
            color: white;
            background: #2b4a6f;
            letter-spacing: 1px;
        }

        /* Контейнер для двух баннеров на всю ширину */
        .banners-wrapper {
            width: 100%;
            background: #2b4a6f;
            display: flex;
            justify-content: center;
            padding: 0;  /* убрал отступы */
        }

        .banners-container {
            width: 100%;
            max-width: 100%;  /* на всю доступную ширину */
            display: flex;
            justify-content: center;
            gap: 0;  /* убрал зазоры, чтобы были вплотную */
            background: #2b4a6f;
        }

        /* Каждый баннер занимает половину доступной ширины */
        .banner {
            flex: 1;  /* каждый баннер занимает равную долю */
            height: auto;
            aspect-ratio: 1100/218;  /* сохраняем пропорции 1100x218 */
            background: #e0e0e0;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Основной белый блок */
        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 60px 60px 60px 60px;
            padding: 40px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            border: 5px solid #ffd700;
            margin: 30px 20px;
        }

        /* Заголовок Ozon (теперь это кнопка на главную страницу) */
        .ozon-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 4px solid #005bff;
            padding-bottom: 20px;
        }

        .ozon-logo {
            font-size: 5rem;
            font-weight: 900;
            color: #005bff;
            background: white;
            padding: 0 20px;
            border-radius: 60px;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: white;
        }

        .ozon-logo:active {
            transform: translateY(3px);
        }

        .ozon-sub {
            font-size: 2.2rem;
            color: #1f3a5f;
            background: #e5efff;
            padding: 10px 30px;
            border-radius: 40px;
        }

        /* Поисковая строка — увеличенная */
        .search-section {
            margin: 30px 0 40px;
        }

        .search-label {
            font-size: 2.4rem;
            font-weight: 600;
            color: #1f3a5f;
            margin-bottom: 20px;
            display: block;
        }

        .search-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 35px 40px;
            font-size: 3.2rem;
            border: 6px solid #005bff;
            border-radius: 80px;
            outline: none;
            background: #f5f9ff;
            font-weight: 500;
            color: #001f3f;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
        }

        .search-input::placeholder {
            color: #7f9fbf;
            font-size: 2.8rem;
        }

        .search-button {
            background: #ffd700;
            border: none;
            border-radius: 80px;
            padding: 35px 60px;
            font-size: 3.2rem;
            font-weight: bold;
            color: #001f3f;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 8px 0 #b8860b;
            transition: 0.05s linear;
            white-space: nowrap;
        }

        .search-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b8860b;
        }

        .example-query {
            margin-top: 20px;
            font-size: 2.2rem;
            color: #2d4b6e;
            background: #e9f0fa;
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
        }

        /* Раздел "Рекомендуем на Озоне!" */
        .recommend-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #005bff;
            margin: 50px 0 30px;
            text-align: center;
            background: #fff7cf;
            padding: 20px;
            border-radius: 60px;
            border: 3px solid #ffd700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 20px;
        }

        /* Карточка товара — просто большая цветная кнопка */
        .product-card {
            background: #f5f9ff;
            border-radius: 50px;
            padding: 45px 20px 50px;
            text-align: center;
            border: 4px solid #005bff;
            box-shadow: 0 15px 0 #003d99;
            transition: 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 280px;
        }

        .product-card:active {
            transform: translateY(8px);
            box-shadow: 0 5px 0 #003d99;
        }

        .product-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: #001f3f;
            margin: 10px 0 20px;
        }

        .product-price {
            font-size: 3.2rem;
            font-weight: 900;
            color: #b12704;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid #ffd700;
            align-self: center;
        }

        .footer-note {
            margin-top: 40px;
            text-align: center;
            font-size: 2.2rem;
            color: white;
            background: #1f3a5f;
            padding: 20px;
            border-radius: 40px;
            border: 3px solid #ffd700;
        }

        /* Адаптация */
        @media (max-width: 1000px) {
            .banners-container {
                flex-direction: column;
            }
            .banner {
                width: 100%;
                aspect-ratio: 1100/218;
            }
            .top-nav {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 800px) {
            .container { padding: 20px; }
            .products-grid { grid-template-columns: 1fr; }
            .search-row { flex-direction: column; }
            .search-input { padding: 25px; font-size: 2.5rem; width: 100%; }
            .search-button { width: 100%; padding: 25px; }
            .ozon-logo { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <!-- Верхняя навигация: Кабинет и Мои заказы -->
    <div class="top-nav">
        <button class="nav-btn" onclick="window.location.href='https://www.ozon.ru/my/'">👤 Кабинет</button>
        <button class="nav-btn" onclick="window.location.href='https://www.ozon.ru/my/orderlist/'">📦 Мои заказы</button>
    </div>

    <!-- Надпись над баннерами -->
    <div class="banner-header">
        📢 Предложения из сети Интернет
    </div>

    <!-- Два баннера на всю ширину окна -->
    <div class="banners-wrapper">
        <div class="banners-container">
            <!-- Левый баннер (banner.png, banner2.png, banner3.png) -->
            <div class="banner">
                <img id="leftBanner" src="banner.png" alt="Реклама">
            </div>
            <!-- Правый баннер (bannerR.png, bannerR2.png, bannerR3.png, bannerR4.png) -->
            <div class="banner">
                <img id="rightBanner" src="bannerR.png" alt="Реклама">
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Шапка Ozon (теперь ведет на главную страницу) -->
        <div class="ozon-header">
            <button class="ozon-logo" onclick="window.location.href='https://imacstartupscreen.vercel.app/'">OZON</button>
            <span class="ozon-sub">ИНТЕРНЕТ-ТОВАРЫ</span>
        </div>

        <!-- Поисковая строка -->
        <div class="search-section">
            <div class="search-label">🔍 Что ищем сегодня?</div>
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="например, носки, чайник, iMac..." value="">
                <button class="search-button" id="searchBtn">Найти на Ozon</button>
            </div>
            <div class="example-query">
                ⚡ Введи любой товар и нажми Найти
            </div>
        </div>

        <!-- Рекомендуем на Озоне! -->
        <div class="recommend-title">🔥 Рекомендуем на Озоне! 🔥</div>
        <div class="products-grid" id="recommendations">
            <!-- Карточки будут вставлены скриптом -->
        </div>

        <!-- Подсказка -->
        <div class="footer-note">
            ⭐ Нажми на карточку — откроется поиск этого товара на Ozon ⭐
        </div>
    </div>

    <script>
        // --- СПИСОК ИЗ 20 ТОВАРОВ ---
        const products = [
            { name: "Носки шерстяные (пара)", price: 890 },
            { name: "Журнал 'Сад и огород'", price: 350 },
            { name: "Платье в цветочек", price: 3990 },
            { name: "iMac 24\" 8GB 256GB", price: 149990 },
            { name: "Телевизор 55\" 4K", price: 59990 },
            { name: "Лампа настольная LED", price: 2490 },
            { name: "Подушка ортопедическая", price: 3250 },
            { name: "Торшер напольный", price: 5490 },
            { name: "iPhone 15 128GB", price: 79990 },
            { name: "Чайник электрический", price: 2790 },
            { name: "Кружка с подогревом", price: 1290 },
            { name: "Плед мягкий 150x200", price: 3590 },
            { name: "Набор кастрюль 3шт", price: 4990 },
            { name: "Фен для волос", price: 3190 },
            { name: "Утюг беспроводной", price: 4290 },
            { name: "Микроволновка 20л", price: 9990 },
            { name: "Пылесос ручной", price: 6990 },
            { name: "Весы напольные", price: 1990 },
            { name: "Термос 1л", price: 1590 },
            { name: "Зонт автомат", price: 1490 }
        ];

        function getRandomProducts(count = 3) {
            const shuffled = [...products].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        function createProductCard(product) {
            const formattedPrice = product.price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            return `
                <div class="product-card" onclick="searchProduct('${product.name}')">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${formattedPrice} ₽</div>
                </div>
            `;
        }

        function renderRecommendations() {
            const randomProducts = getRandomProducts(3);
            const container = document.getElementById('recommendations');
            container.innerHTML = randomProducts.map(createProductCard).join('');
        }

        window.searchProduct = function(query) {
            const encoded = encodeURIComponent(query).replace(/%20/g, '+');
            window.location.href = `https://www.ozon.ru/search/?from_global=true&text=${encoded}`;
        };

        document.getElementById('searchBtn').addEventListener('click', function() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) searchProduct(query);
        });

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) searchProduct(query);
            }
        });

        renderRecommendations();

        // --- СКРИПТ ДЛЯ СМЕНЫ БАННЕРОВ КАЖДЫЕ 6 СЕКУНД ---
        const leftBanner = document.getElementById('leftBanner');
        const rightBanner = document.getElementById('rightBanner');

        // Левый баннер: только 3 изображения
        const leftBanners = ['banner.png', 'banner2.png', 'banner3.png'];
        // Правый баннер: 4 изображения
        const rightBanners = ['bannerR.png', 'bannerR2.png', 'bannerR3.png', 'bannerR4.png'];

        let leftIndex = 0;
        let rightIndex = 0;

        function changeBanners() {
            // Смена левого баннера
            leftIndex = (leftIndex + 1) % leftBanners.length;
            leftBanner.src = leftBanners[leftIndex];
            leftBanner.alt = `Реклама ${leftIndex + 1}`;

            // Смена правого баннера
            rightIndex = (rightIndex + 1) % rightBanners.length;
            rightBanner.src = rightBanners[rightIndex];
            rightBanner.alt = `Реклама ${rightIndex + 1}`;
        }

        // Запускаем интервал на 6 секунд (6000 мс)
        setInterval(changeBanners, 6000);

        // Обработка ошибок загрузки
        leftBanner.onerror = function() {
            this.style.background = '#ffd700';
            this.alt = 'Реклама временно недоступна';
        };
        rightBanner.onerror = function() {
            this.style.background = '#ffd700';
            this.alt = 'Реклама временно недоступна';
        };
    </script>
</body>
</html>
