<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой старт для бабушки</title>
    <style>
        /* Абсолютный минимум: крупно, контрастно, никаких лишних эффектов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #2b4a6f;  /* темно-синий для контраста */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 50px;
            padding: 40px 50px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }

        /* Часы: просто и понятно */
        .clocks {
            display: flex;
            justify-content: space-between;
            background: #e5efff;
            border-radius: 40px;
            padding: 25px 40px;
            margin-bottom: 40px;
            border: 3px solid #1f3a5f;
        }

        .city {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1f3a5f;
        }

        .time {
            font-size: 3.2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: #1f3a5f;
            color: white;
            padding: 10px 25px;
            border-radius: 40px;
            margin-top: 8px;
            text-align: center;
        }

        /* Справка — одной строкой, крупно */
        .help {
            background: #fde156;
            border-radius: 40px;
            padding: 20px 30px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #1f3a5f;
            text-align: center;
            margin-bottom: 40px;
            border: 3px solid #b38f00;
        }

        /* Кнопки — максимально простые и большие */
        .btn {
            border: none;
            border-radius: 40px;
            font-size: 3.2rem;
            font-weight: bold;
            padding: 40px 20px;
            cursor: pointer;
            color: white;
            text-align: center;
            text-decoration: none;
            display: block;
            border: 4px solid white;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            transition: 0.05s linear;
            width: 100%;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* Цвета кнопок (яркие, различимые) */
        .ozon { background: #005bff; }
        .wb { background: #9c27b0; }
        .ig { background: #d62976; }  /* цвет Instagram */
        .ai { 
            background: #00a86b; 
            font-size: 4rem;
            padding: 60px 20px;
            margin-top: 25px;
        }

        /* Ряд из трех кнопок */
        .row-three {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        /* Адаптация для узких экранов */
        @media (max-width: 700px) {
            .clocks { flex-direction: column; gap: 20px; }
            .row-three { flex-direction: column; }
            .btn { font-size: 2.8rem; padding: 30px; }
            .ai { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <div class="screen">
        <!-- Часы: Москва слева, Париж справа -->
        <div class="clocks">
            <div>
                <div class="city">🇷🇺 Москва</div>
                <div class="time" id="moscow">--:--:--</div>
            </div>
            <div>
                <div class="city">🇫🇷 Париж</div>
                <div class="time" id="paris">--:--:--</div>
            </div>
        </div>

        <!-- Простая справка -->
        <div class="help">
            👆 Нажимай на большие кнопки — они откроют нужные сайты
        </div>

        <!-- Три кнопки в ряд: Ozon, Wildberries, Instagram (каждая по одному разу) -->
        <div class="row-three">
            <button class="btn ozon" onclick="window.location.href='https://www.ozon.ru'">🛍️ Ozon</button>
            <button class="btn wb" onclick="window.location.href='https://www.wildberries.ru'">📦 Wildberries</button>
            <button class="btn ig" onclick="window.location.href='https://instseniormode1w.vercel.app'">📷 Instagram</button>
        </div>

        <!-- Большая кнопка ИИ на всю ширину -->
        <button class="btn ai" onclick="window.location.href='https://linteh-ai.vercel.app/withoutBranding-Service.html'">
            🤖 Искусственный интеллект
        </button>

        <!-- Совсем простой низ (ничего лишнего) -->
        <div style="text-align: center; margin-top: 30px; font-size: 1.8rem; color: #1f3a5f;">
            
        </div>
    </div>

    <script>
        // Часы — только самое нужное
        function updateTime() {
            try {
                const now = new Date();
                // Москва (UTC+3)
                const moscow = new Intl.DateTimeFormat('ru-RU', {
                    timeZone: 'Europe/Moscow',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(now);
                // Париж (с учетом летнего/зимнего времени)
                const paris = new Intl.DateTimeFormat('ru-RU', {
                    timeZone: 'Europe/Paris',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(now);
                
                document.getElementById('moscow').textContent = moscow;
                document.getElementById('paris').textContent = paris;
            } catch (e) {
                // Если не работает (редко) — покажем хоть что-то
                document.getElementById('moscow').textContent = '12:00:00';
                document.getElementById('paris').textContent = '10:00:00';
            }
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
